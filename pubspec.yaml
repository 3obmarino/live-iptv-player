name: live_tv_player
description: Simple Live TV + EPG IPTV player (Xtream Codes / M3U) for Windows.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  http: ^1.2.2
  path_provider: ^2.1.4
  xml: ^6.5.0
  window_manager: ^0.4.3
  url_launcher: ^6.3.0
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
