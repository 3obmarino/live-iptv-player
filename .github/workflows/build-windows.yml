name: Build Windows + Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      # The repo only holds lib/ + pubspec; generate the Windows runner once.
      - name: Generate Windows runner
        shell: pwsh
        run: |
          if (-not (Test-Path windows)) {
            flutter create --platforms=windows --project-name live_tv_player --org dk.livetvplayer .
          }

      - run: flutter pub get

      - name: Analyze (informational)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Unit tests
        run: flutter test

      - name: Build
        run: flutter build windows --release

      - name: Bundle VC++ runtime (so it runs on a clean PC)
        shell: pwsh
        run: |
          $dst = "build\windows\x64\runner\Release"
          foreach ($f in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$f" $dst -ErrorAction SilentlyContinue
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=1.0.${{ github.run_number }}" installer\setup.iss

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\LiveTVPlayer-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LiveTVPlayer-Windows
          path: dist/*

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name live_tv_player --org dk.livetvplayer .
          fi
          M=android/app/src/main/AndroidManifest.xml
          # Internet + plain-http streams/logos (most IPTV servers use http)
          grep -q 'android.permission.INTERNET' $M || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $M
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' $M
          sed -i 's|android:label="live_tv_player"|android:label="Live TV"|' $M
          cat $M

      # Fixed signing key so new APKs install as updates over old ones.
      - name: Use the project's signing key
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Build APK (arm64 – Pixel 7 and other modern phones)
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/LiveTV-1.0.${{ github.run_number }}-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiveTV-Android
          path: dist/*.apk

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
