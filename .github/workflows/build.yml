name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the release job may write.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      # Build number = run number + 100: the workflow was renamed (build-windows.yml
      # -> build.yml), which restarted GitHub's counter, and versions must keep
      # going up (1.0.37 was the last build of the old workflow).
      - name: Build number
        shell: bash
        run: echo "BUILD=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      # The repo only holds lib/ + pubspec; generate the Windows runner once.
      - name: Generate Windows runner
        shell: pwsh
        run: |
          if (-not (Test-Path windows)) {
            flutter create --platforms=windows --project-name live_tv_player --org dk.livetvplayer .
          }
          Copy-Item branding\icon.ico windows\runner\resources\app_icon.ico -Force
          # Publisher and names shown by Windows (Properties, Task Manager,
          # Apps list). Note: path_provider builds the data folder from
          # CompanyName\ProductName -> %APPDATA%\Ukendt Software\Live TV Player
          $rc = 'windows\runner\Runner.rc'
          $t = Get-Content $rc -Raw
          $t = $t -replace '"CompanyName", "[^"]*"', '"CompanyName", "Ukendt Software"'
          $t = $t -replace '"FileDescription", "[^"]*"', '"FileDescription", "Live TV Player"'
          $t = $t -replace '"ProductName", "[^"]*"', '"ProductName", "Live TV Player"'
          $t = $t -replace '"LegalCopyright", "[^"]*"', '"LegalCopyright", "Copyright (C) 2026 Ukendt Software"'
          Set-Content $rc $t -NoNewline
          Select-String -Path $rc -Pattern 'CompanyName|ProductName|FileDescription|LegalCopyright'

      - run: flutter pub get

      - name: Analyze (informational)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Unit tests
        run: flutter test test/parsing_test.dart  # flutter create adds a sample widget_test.dart

      - name: Build
        run: flutter build windows --release --build-name=1.0.${{ env.BUILD }} --build-number=${{ env.BUILD }} --dart-define=APP_BUILD=${{ env.BUILD }}

      - name: Bundle VC++ runtime (so it runs on a clean PC)
        shell: pwsh
        run: |
          $dst = "build\windows\x64\runner\Release"
          foreach ($f in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$f" $dst -ErrorAction SilentlyContinue
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=1.0.${{ env.BUILD }}" installer\windows-setup.iss

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\LiveTV-Player-Windows-Portable-1.0.${{ env.BUILD }}.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LiveTV-Player-Windows
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      # Build number = run number + 100: the workflow was renamed (build-windows.yml
      # -> build.yml), which restarted GitHub's counter, and versions must keep
      # going up (1.0.37 was the last build of the old workflow).
      - name: Build number
        shell: bash
        run: echo "BUILD=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # Newest stable: the Android media_kit plugins need compileSdk 36.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name live_tv_player --org dk.livetvplayer .
          fi
          M=android/app/src/main/AndroidManifest.xml
          # Internet + plain-http streams/logos (most IPTV servers use http)
          grep -q 'android.permission.INTERNET' $M || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $M
          sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application|' $M
          sed -i 's|<application|<application android:usesCleartextTraffic="true" android:allowBackup="false" android:fullBackupContent="false"|' $M
          sed -i 's|android:label="live_tv_player"|android:label="Live TV"|' $M
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r branding/android/mipmap-* android/app/src/main/res/
          bash tools/android-native.sh
          cat $M

      # Fixed signing key so new APKs install as updates over old ones.
      - name: Signing key (from the ANDROID_KEYSTORE_B64 secret)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_B64 repository secret (see README)."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - run: flutter pub get

      - name: Build APK (arm64 – Pixel 7 and other modern phones)
        run: flutter build apk --release --target-platform android-arm64 --build-name=1.0.${{ env.BUILD }} --build-number=${{ env.BUILD }} --dart-define=APP_BUILD=${{ env.BUILD }}

      - name: Rename
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/LiveTV-Player-Phone-1.0.${{ env.BUILD }}.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LiveTV-Android
          path: dist/*.apk

  android-tv:
    runs-on: ubuntu-latest
    steps:
      # Build number = run number + 100: the workflow was renamed (build-windows.yml
      # -> build.yml), which restarted GitHub's counter, and versions must keep
      # going up (1.0.37 was the last build of the old workflow).
      - name: Build number
        shell: bash
        run: echo "BUILD=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Generate Android TV project
        run: |
          flutter create --platforms=android --project-name live_tv_player --org dk.livetvplayer .
          M=android/app/src/main/AndroidManifest.xml
          # permissions + TV features (no touchscreen required, leanback launcher)
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <uses-feature android:name="android.software.leanback" android:required="false"/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>\n    <application|' $M
          sed -i 's|<application|<application android:usesCleartextTraffic="true" android:allowBackup="false" android:fullBackupContent="false" android:banner="@drawable/banner"|' $M
          sed -i 's|<category android:name="android.intent.category.LAUNCHER"/>|<category android:name="android.intent.category.LAUNCHER"/>\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>|' $M
          sed -i 's|android:label="live_tv_player"|android:label="Live TV"|' $M
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r branding/android/mipmap-* branding/android/drawable-* android/app/src/main/res/
          bash tools/android-native.sh
          cat $M

      - name: Signing key (from the ANDROID_KEYSTORE_B64 secret)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_B64 repository secret (see README)."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - run: flutter pub get

      # 32- and 64-bit ARM: Chromecast with Google TV runs a 32-bit userspace.
      - name: Build TV APK
        run: flutter build apk --release --target-platform android-arm,android-arm64 --build-name=1.0.${{ env.BUILD }} --build-number=${{ env.BUILD }} --dart-define=APP_BUILD=${{ env.BUILD }} --dart-define=TV=true

      # Fixed file name => stable URL for the Downloader app:
      # https://github.com/3obmarino/live-iptv-player/releases/latest/download/LiveTV-TV.apk
      - name: Rename
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/LiveTV-Player-TV-1.0.${{ env.BUILD }}.apk
          # Fixed name without version: the Downloader code 8371457 points here
          cp build/app/outputs/flutter-apk/app-release.apk dist/LiveTV-TV.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LiveTV-GoogleTV
          path: dist/*.apk

  # Every successful build on main becomes a GitHub release. The apps check
  # "latest release" to offer updates.
  release:
    needs: [windows, android, android-tv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Build number = run number + 100: the workflow was renamed (build-windows.yml
      # -> build.yml), which restarted GitHub's counter, and versions must keep
      # going up (1.0.37 was the last build of the old workflow).
      - name: Build number
        shell: bash
        run: echo "BUILD=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums (the apps verify downloads against these)
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.0.${{ env.BUILD }}
          name: Live TV Player 1.0.${{ env.BUILD }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            | File | For |
            |---|---|
            | **LiveTV-Player-Windows-Setup-1.0.${{ env.BUILD }}.exe** | Windows 10/11 – installer (or use *Install* in the app) |
            | **LiveTV-Player-Windows-Portable-1.0.${{ env.BUILD }}.zip** | Windows – no install, unzip and run |
            | **LiveTV-Player-Phone-1.0.${{ env.BUILD }}.apk** | Android phones (64-bit) |
            | **LiveTV-Player-TV-1.0.${{ env.BUILD }}.apk** | Google TV, Android TV, TV boxes and Android signage screens – or enter code **8371457** in the Downloader app |
            | LiveTV-TV.apk | Same TV app without version in the name – the Downloader code 8371457 always fetches this one |

            Changes: ${{ github.event.head_commit.message }}
          files: dist/*
